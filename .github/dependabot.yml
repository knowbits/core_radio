version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/build__electron_app"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/build__tauri_app"
    schedule:
      interval: "weekly"
  - package-ecosystem: "cargo"
    directory: "/build__tauri_app/src-tauri"
